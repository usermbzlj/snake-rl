[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snake_rl"]

[project]
name = "snake-rl"
version = "2.0.0"
description = "Snake AI Training Lab: GPU-vectorized env, PPO/DQN, FastAPI + Vue web console."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "numpy>=2.0",
    "pydantic>=2",
    "torch>=2.11.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
snake-lab = "snake_rl.server.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running GPU learning tests",
]

# PyPI 的 Windows torch 是 CPU 轮子。RTX 50 系列（sm_120）需要官方 CUDA 12.8+ 构建。
# Linux CI 使用官方 CPU 轮子，避免拉取巨大的 CUDA 包。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
    "RUF001",  # Chinese UI strings use fullwidth punctuation intentionally
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["snake_rl"]

[tool.pyright]
include = ["snake_rl", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
