[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snake_rl"]

[project]
name = "snake-rl"
version = "0.1.0"
description = "Snake RL workspace: browser game, Double DQN (small_cnn/adaptive_cnn/hybrid), curriculum & parallel training, FastAPI web console."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "numpy>=2.4.3",
    "tensorboard>=2.18",
    "torch>=2.11.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
snake-rl = "snake_rl.cli:main"
snake-webui = "snake_rl.web_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27",
]
plot = [
    "matplotlib>=3.10.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# PyPI 的 Windows torch 是 CPU 轮子。RTX 50 系（sm_120）需要官方 CUDA 12.8+ 构建。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
