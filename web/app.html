<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b12" />
  <title>贪吃蛇 AI 训练控制台</title>
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/assets/console.css" />
  <script src="/assets/vendor/vue.global.prod.js"></script>
</head>
<body>
<div id="app" class="console-app" v-cloak>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>贪吃蛇 RL</h1>
        <p>玩 · 练 · 看 AI</p>
      </div>
    </div>
    <nav class="tabs" aria-label="控制台分区">
      <button type="button" :class="{active: tab==='home'}" :aria-current="tab==='home' ? 'page' : null" @click="setTab('home')">总览</button>
      <button type="button" :class="{active: tab==='train'}" :aria-current="tab==='train' ? 'page' : null" @click="setTab('train')">训练</button>
      <button type="button" :class="{active: tab==='runs'}" :aria-current="tab==='runs' ? 'page' : null" @click="setTab('runs')">记录</button>
      <button type="button" :class="{active: tab==='svc'}" :aria-current="tab==='svc' ? 'page' : null" @click="setTab('svc')">服务</button>
      <button type="button" :class="{active: tab==='doc'}" :aria-current="tab==='doc' ? 'page' : null" @click="setTab('doc')">手册</button>
    </nav>
    <div class="topbar-status" aria-label="服务状态">
      <span class="status-pill" :class="status.training ? 'on live' : 'off'">训练</span>
      <span class="status-pill" :class="status.monitor ? 'on' : 'off'">TensorBoard</span>
      <span class="status-pill" :class="status.infer ? 'on' : 'off'">推理</span>
      <span class="status-pill" :class="wsConnected ? 'on' : 'off'">{{ wsConnected ? '实时' : '重连中' }}</span>
    </div>
  </header>

  <div id="main">
    <template v-if="tab==='home'">
      <section class="hero">
        <h2>从玩游戏到训练 AI，一条路走完</h2>
        <p>新手先走「5 分钟试跑」确认流程；有模型后一键演示。手机和电脑在同一局域网也能打开游戏页。</p>
      </section>

      <section class="panel live-card" v-if="status.training">
        <h2 class="panel-title">正在训练{{ progress.training_run ? ' · ' + progress.training_run : '' }}</h2>
        <div class="progress-head">
          <strong>{{ progressLabel }}</strong>
          <span class="progress-meta">{{ etaLabel || '正在估算剩余时间…' }}</span>
        </div>
        <div class="progress-bar" role="progressbar" :aria-valuenow="progress.percent" aria-valuemin="0" aria-valuemax="100">
          <div :style="{width: progress.percent + '%'}"></div>
        </div>
        <div class="metric-grid">
          <div class="metric"><span>平均奖励</span><strong>{{ fmt(progress.avg_reward) }}</strong></div>
          <div class="metric"><span>探索率 ε</span><strong>{{ fmt(progress.epsilon) }}</strong></div>
          <div class="metric"><span>阶段</span><strong>{{ progress.stage || '—' }}</strong></div>
          <div class="metric"><span>已用时</span><strong>{{ elapsedLabel || '—' }}</strong></div>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary" @click="openTrainPreview">打开训练实况</button>
          <button type="button" class="btn btn-sec" @click="setTab('train')">查看日志与参数</button>
          <button type="button" class="btn btn-danger" @click="stopTrain">停止训练</button>
        </div>
      </section>

      <section class="panel" v-else>
        <h2 class="panel-title">三步上手</h2>
        <div class="journey">
          <button type="button" class="journey-card" @click="openGame">
            <span class="step-num">1</span>
            <h3>先玩游戏</h3>
            <p>熟悉 A / D 转向。不训练也能直接玩，适合演示和教学。</p>
          </button>
          <button type="button" class="journey-card" @click="setTab('train')">
            <span class="step-num">2</span>
            <h3>开一轮训练</h3>
            <p>用预设 5 分钟试跑，或从零配置。训练中可随时看实况。</p>
          </button>
          <button type="button" class="journey-card" @click="setTab('runs')">
            <span class="step-num">3</span>
            <h3>看 AI 玩</h3>
            <p>选一次有权重的训练，一键启动推理并打开游戏页。</p>
          </button>
        </div>
      </section>

      <div class="home-grid">
        <section class="panel">
          <h2 class="panel-title">最近训练</h2>
          <div v-if="recentRuns.length === 0" class="empty-state">
            还没有运行记录。<button type="button" class="btn btn-sec" @click="setTab('train')">去开一轮训练</button>
          </div>
          <div class="run-grid" v-else>
            <button type="button" class="run-card" v-for="r in recentRuns" :key="r.name" @click="openRun(r)">
              <header>
                <h3>{{ r.name }}</h3>
                <span class="badge" :class="r.status_key">{{ r.status }}</span>
              </header>
              <dl>
                <div><dt>模型</dt><dd>{{ r.model }}</dd></div>
                <div><dt>局数</dt><dd>{{ r.episodes }}</dd></div>
                <div><dt>最佳</dt><dd>{{ r.best_reward }}</dd></div>
              </dl>
            </button>
          </div>
        </section>
        <section class="panel">
          <h2 class="panel-title">快捷入口</h2>
          <div class="stack">
            <button type="button" class="btn btn-primary" @click="applyPreset('trial')" :disabled="status.training">套用 5 分钟试跑并去训练</button>
            <button type="button" class="btn" @click="demoLatest" :disabled="!latestDemoRun">演示最近一次可用模型</button>
            <button type="button" class="btn btn-sec" @click="openGame">打开游戏页</button>
            <button type="button" class="btn btn-sec" @click="startMonitor">打开 TensorBoard</button>
          </div>
          <p class="panel-lead" style="margin-top:14px">局域网游戏地址（手机同 Wi-Fi 可打开）</p>
          <div class="url-box">
            <code>{{ lanPlayUrl }}</code>
            <button type="button" class="btn btn-sec" @click="copy(lanPlayUrl)">复制</button>
          </div>
        </section>
      </div>
    </template>

    <template v-if="tab==='train'">
      <section class="panel" aria-labelledby="train-task-title">
        <h2 id="train-task-title" class="panel-title">开始一次训练</h2>
        <div class="task-selector">
          <button type="button" class="task-btn" :class="{active: trainMode==='new'}" @click="trainMode='new'">
            <span class="task-title">全新训练</span>
            <span class="task-desc">从零开始，按当前配置训练</span>
          </button>
          <button type="button" class="task-btn" :class="{active: trainMode==='resume'}" @click="trainMode='resume'; loadRuns()">
            <span class="task-title">原样继续练</span>
            <span class="task-desc">保留优化器、回放池和探索进度</span>
          </button>
          <button type="button" class="task-btn" :class="{active: trainMode==='warm'}" @click="trainMode='warm'; loadRuns()">
            <span class="task-title">换参数继续练</span>
            <span class="task-desc">只迁移权重，可改学习率与奖励</span>
          </button>
        </div>

        <div v-if="trainMode !== 'new'" class="resume-block">
          <div class="block-hint" v-if="trainMode==='resume'">
            <strong>原样继续练</strong>：配置以保存点为准，下方参数不参与本次训练。
          </div>
          <div class="block-hint" v-else>
            <strong>换参数继续练</strong>：只继承权重。灰显项不能改；学习率、奖励可以调整。
          </div>
          <div class="row">
            <label for="resumeRun">选择上次的训练</label>
            <select id="resumeRun" v-model="resumeRun" @change="loadArtifacts">
              <option value="">-- 请选择 --</option>
              <option v-for="r in runs" :key="r.name" :value="r.name">{{ r.name }}（{{ r.model }}，{{ r.status }}，{{ r.episodes }} 局）</option>
            </select>
            <button type="button" class="btn btn-sec" @click="loadRuns">刷新列表</button>
          </div>
          <div v-if="trainMode === 'resume'" class="row">
            <label for="extraEpisodes">再训练多少局</label>
            <input id="extraEpisodes" type="number" v-model.number="extraEpisodes" min="100" step="1000" />
            <span class="progress-meta">在已完成基础上追加</span>
          </div>
          <template v-if="trainMode === 'warm' && resumeArtifacts.checkpoints.length > 0">
            <div class="row">
              <label for="warmCheckpoint">使用哪个权重</label>
              <select id="warmCheckpoint" v-model="warmCheckpoint">
                <option v-for="c in resumeArtifacts.checkpoints" :key="c.path" :value="c.path">{{ c.name }}</option>
              </select>
            </div>
            <div class="row">
              <label>
                <input type="checkbox" v-model="warmInheritGlobalStep" />
                延续上次的探索进度（推荐）
              </label>
            </div>
          </template>
          <div v-if="resumeRun && trainMode === 'resume' && resumeArtifacts._loaded && !resumeArtifacts.state_file" class="msg err">
            该训练没有完整恢复文件（state/training.pt）。请改用「换参数继续练」。
          </div>
          <div v-if="resumeRun && trainMode === 'warm' && resumeArtifacts._loaded && resumeArtifacts.checkpoints.length === 0" class="msg err">
            该训练没有可用的权重文件（checkpoints/*.pt）。
          </div>
        </div>

        <p class="panel-lead" v-if="trainMode==='new'">不确定参数？先点一个预设，再按「开始训练」。全部超参仍可在下方展开。</p>
        <div class="preset-grid" v-if="trainMode==='new'">
          <button type="button" class="preset-btn" v-for="p in presets" :key="p.id" :class="{active: activePreset===p.id}" @click="applyPreset(p.id)">
            <span class="preset-title">{{ p.title }}</span>
            <span class="preset-desc">{{ p.desc }}</span>
          </button>
        </div>

        <div class="row">
          <button type="button" class="btn btn-lg" :disabled="status.training || !canStartTrain" @click="startTrain">
            {{ trainMode === 'new' ? '开始训练' : trainMode === 'resume' ? '开始恢复训练' : '开始热加载训练' }}
          </button>
          <button type="button" class="btn btn-sec" :disabled="!status.training" @click="stopTrain">停止</button>
          <button type="button" class="btn btn-sec" :disabled="!status.training && !selectedRun" @click="openTrainPreview">训练实况</button>
          <button type="button" class="btn btn-sec" :disabled="status.estimating" @click="startEstimate">估算耗时</button>
          <button type="button" class="btn btn-sec" :disabled="!status.estimating" @click="stopEstimate">停止估算</button>
          <span class="progress-meta" v-if="configDirty">有未保存的参数改动，开始训练时会自动校验保存</span>
        </div>
      </section>

      <details class="panel panel-advanced">
        <summary>高级设置：训练方案 / 并行采样</summary>
        <div class="adv-content">
          <div class="row">
            <label for="scheme">训练方案</label>
            <select id="scheme" v-model="ui.scheme" @change="saveUi" :disabled="trainMode==='resume'">
              <option v-for="(_,k) in schemes" :key="k" :value="k">{{ k }}</option>
            </select>
            <span class="progress-meta">{{ schemes[ui.scheme] }}</span>
          </div>
          <div class="row">
            <label>
              <input type="checkbox" v-model="ui.parallel" @change="saveUi" :disabled="trainMode==='resume'" />
              并行采样（多核加速）
            </label>
            <template v-if="ui.parallel && trainMode !== 'resume'">
              <label>Workers <input type="number" v-model.number="ui.parallel_workers" min="1" max="64" @change="saveUi" /></label>
              <label>同步步长 <input type="number" v-model.number="ui.parallel_sync_interval" min="16" @change="saveUi" /></label>
            </template>
          </div>
        </div>
      </details>

      <section class="panel" v-if="ui.scheme==='custom'" aria-labelledby="config-title">
        <h2 id="config-title" class="panel-title">常用参数</h2>
        <div v-if="trainMode==='resume'" class="config-mode-banner">
          原样继续练：下方参数<strong>不参与</strong>训练，以 <code>state/training.pt</code> 为准。
        </div>
        <div v-if="trainMode==='warm'" class="config-mode-banner">
          换参数继续练：灰显项与权重结构绑定。学习率、奖励等可调。
        </div>
        <div class="essentials">
          <div v-for="f in essentialFields" :key="f.key" class="field-block" :class="{ 'is-locked': trainMode==='warm' && fieldLocked(f.key) && trainMode!=='resume', 'is-resume-locked': trainMode==='resume' }">
            <div class="field-label">{{ f.label }}</div>
            <div class="field-tip">{{ f.tip }}</div>
            <template v-if="f.type==='bool'">
              <input type="checkbox" :checked="!!getField(f.key)" @change="setField(f.key, $event.target.checked)" :disabled="fieldLocked(f.key)" />
            </template>
            <template v-else-if="f.type==='select'">
              <select :value="String(getField(f.key)??'')" @change="setField(f.key, $event.target.value)" :disabled="fieldLocked(f.key)">
                <option v-for="c in f.choices" :key="c" :value="c">{{ c }}</option>
              </select>
            </template>
            <template v-else-if="f.type==='number'">
              <input type="number" :value="getField(f.key)" @input="setFieldCoerce(f.key, $event.target.value, 'number')" :disabled="fieldLocked(f.key)" />
            </template>
            <template v-else-if="f.type==='float'">
              <input type="number" step="any" :value="getField(f.key)" @input="setFieldCoerce(f.key, $event.target.value, 'float')" :disabled="fieldLocked(f.key)" />
            </template>
            <template v-else>
              <input class="grow" type="text" :value="fieldStr(f.key)" @input="setFieldCoerce(f.key, $event.target.value, f.type)" :disabled="fieldLocked(f.key)" />
            </template>
          </div>
        </div>

        <details class="panel-advanced" style="border:1px solid var(--border);border-radius:10px">
          <summary>全部训练参数</summary>
          <div class="adv-content">
            <div class="row">
              <label for="configPath">配置文件</label>
              <input id="configPath" class="grow" type="text" v-model="ui.custom_config_path" @blur="saveUi" :disabled="trainMode==='resume'" />
              <button type="button" class="btn btn-sec" @click="loadConfig" :disabled="trainMode==='resume'">从磁盘加载</button>
              <button type="button" class="btn" @click="saveConfig" :disabled="trainMode==='resume'">验证并保存</button>
            </div>
            <div class="subtab-bar" role="tablist">
              <button type="button" v-for="t in formTabs" :key="t.tab" :class="{active: subTab===t.tab}" @click="subTab=t.tab" :disabled="trainMode==='resume'">{{ t.tabTitle }}</button>
            </div>
            <template v-for="sec in activeFormSections" :key="sec.tab + sec.groupIdx">
              <div class="group-title">{{ sec.group.title }}</div>
              <div v-for="f in sec.group.fields" :key="'all-'+f.key" class="field-block" :class="{ 'is-locked': trainMode==='warm' && fieldLocked(f.key) && trainMode!=='resume', 'is-resume-locked': trainMode==='resume' }">
                <div class="field-label">{{ f.label }}</div>
                <div class="field-tip">{{ f.tip }}</div>
                <template v-if="f.type==='bool'">
                  <input type="checkbox" :checked="!!getField(f.key)" @change="setField(f.key, $event.target.checked)" :disabled="fieldLocked(f.key)" />
                </template>
                <template v-else-if="f.type==='select'">
                  <select :value="String(getField(f.key)??'')" @change="setField(f.key, $event.target.value)" :disabled="fieldLocked(f.key)">
                    <option v-for="c in f.choices" :key="c" :value="c">{{ c }}</option>
                  </select>
                </template>
                <template v-else-if="f.type==='number'">
                  <input type="number" :value="getField(f.key)" @input="setFieldCoerce(f.key, $event.target.value, 'number')" :disabled="fieldLocked(f.key)" />
                </template>
                <template v-else-if="f.type==='float'">
                  <input type="number" step="any" :value="getField(f.key)" @input="setFieldCoerce(f.key, $event.target.value, 'float')" :disabled="fieldLocked(f.key)" />
                </template>
                <template v-else-if="f.type==='json'">
                  <textarea class="json-field" :value="fieldStr(f.key)" @input="setFieldCoerce(f.key, $event.target.value, 'json')" :disabled="fieldLocked(f.key)"></textarea>
                </template>
                <template v-else-if="f.type==='csv_int' || f.type==='csv_float'">
                  <input class="grow" type="text" :value="fieldStr(f.key)" @input="setFieldCoerce(f.key, $event.target.value, f.type)" :disabled="fieldLocked(f.key)" />
                </template>
                <template v-else>
                  <input class="grow" type="text" :value="fieldStr(f.key)" @input="setFieldCoerce(f.key, $event.target.value, f.type)" :disabled="fieldLocked(f.key)" />
                </template>
              </div>
            </template>
          </div>
        </details>
      </section>

      <section class="panel" aria-labelledby="progress-title" v-if="status.training || progress.episode > 0">
        <div class="progress-head">
          <h2 id="progress-title" class="panel-title">进度 {{ progressLabel }}</h2>
          <span class="progress-meta">{{ etaLabel }}</span>
        </div>
        <div class="progress-bar" role="progressbar" :aria-valuenow="progress.percent" aria-valuemin="0" aria-valuemax="100">
          <div :style="{width: progress.percent + '%'}"></div>
        </div>
        <div class="metric-grid">
          <div class="metric"><span>平均奖励</span><strong>{{ fmt(progress.avg_reward) }}</strong></div>
          <div class="metric"><span>探索率 ε</span><strong>{{ fmt(progress.epsilon) }}</strong></div>
          <div class="metric"><span>阶段</span><strong>{{ progress.stage || '—' }}</strong></div>
          <div class="metric"><span>已用时</span><strong>{{ elapsedLabel || '—' }}</strong></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="log-title">
        <div class="log-toolbar">
          <h2 id="log-title" class="panel-title">输出日志</h2>
          <label>筛选
            <select v-model="logFilter">
              <option value="all">全部</option>
              <option value="progress">进度</option>
              <option value="error">错误</option>
            </select>
          </label>
          <label><input type="checkbox" v-model="logAutoScroll" /> 自动滚动</label>
          <button type="button" class="btn btn-sec" @click="logs=[]">清空</button>
        </div>
        <div class="log-box" ref="logEl" tabindex="0" v-html="logHtml"></div>
      </section>
    </template>

    <template v-if="tab==='runs'">
      <section class="panel row">
        <label>筛选 <input type="search" v-model="runFilter.keyword" placeholder="名称 / 模型" /></label>
        <label>状态
          <select v-model="runFilter.status">
            <option>全部</option><option>完成</option><option>训练中</option><option>中断</option><option>空</option><option>未知</option>
          </select>
        </label>
        <button type="button" class="btn btn-sec" @click="runFilter.keyword=''; runFilter.status='全部'">清除筛选</button>
        <button type="button" class="btn btn-sec" @click="loadRuns">刷新</button>
        <span class="progress-meta">显示 {{ filteredRuns.length }} / {{ runs.length }}</span>
      </section>
      <section class="panel runs-layout">
        <div>
          <div v-if="filteredRuns.length === 0" class="empty-state">还没有匹配的运行记录。先去训练页开一轮，或放宽筛选。</div>
          <div v-else class="run-grid">
            <button type="button" class="run-card" v-for="r in filteredRuns" :key="r.name" :class="{selected: selectedRun && selectedRun.name===r.name}" @click="selectedRun=r">
              <header>
                <h3>{{ r.name }}</h3>
                <span class="badge" :class="r.status_key">{{ r.status }}</span>
              </header>
              <dl>
                <div><dt>模型</dt><dd>{{ r.model }}</dd></div>
                <div><dt>局数</dt><dd>{{ r.episodes }}</dd></div>
                <div><dt>最佳</dt><dd>{{ r.best_reward }}</dd></div>
              </dl>
            </button>
          </div>
          <div class="row" style="margin-top:12px">
            <button type="button" class="btn btn-danger" @click="deleteSelected" :disabled="!selectedRun || status.training || selectedRun.status_key==='running'">删除选中</button>
            <button type="button" class="btn btn-danger" @click="clearAllRuns" :disabled="status.training || runs.some(r => r.status_key==='running')">清空全部</button>
          </div>
        </div>
        <div v-if="selectedRun">
          <h2 class="panel-title">{{ selectedRun.name }}</h2>
          <div class="detail-grid">
            <span>状态</span><span>{{ selectedRun.status }}</span>
            <span>模型</span><span>{{ selectedRun.model }}</span>
            <span>局数</span><span>{{ selectedRun.episodes }}</span>
            <span>最佳</span><span>{{ selectedRun.best_reward }}</span>
            <span>活动</span><span>{{ selectedRun.updated }}</span>
            <span>文件</span><span>{{ selectedRun.badges }}</span>
          </div>
          <div class="stack">
            <button type="button" class="btn" @click="launchDemo" :disabled="!canDemo(selectedRun)">用此模型演示</button>
            <button type="button" class="btn btn-ok" @click="quickResume(selectedRun)" :disabled="status.training || !canResume(selectedRun)">完整恢复训练</button>
            <button type="button" class="btn btn-warn" @click="quickWarm(selectedRun)" :disabled="status.training || !canDemo(selectedRun)">热加载继续训练</button>
            <button type="button" class="btn btn-sec" @click="openMonitorSelected">在 TensorBoard 中查看</button>
            <button type="button" class="btn btn-sec" @click="revealRun">打开运行目录</button>
            <button type="button" class="btn btn-sec" @click="stopInfer">停止推理服务</button>
          </div>
        </div>
        <div v-else class="empty-state">点左侧一张卡片，查看详情和一键操作。</div>
      </section>
    </template>

    <template v-if="tab==='svc'">
      <div class="svc-grid">
        <section class="panel">
          <h2 class="panel-title">TensorBoard</h2>
          <p class="panel-lead">看奖励曲线、损失和学习率。训练时也可以开着，控制台会在重开训练后自动拉起。</p>
          <div class="row">
            <span class="status-pill" :class="status.monitor?'on':'off'">{{ status.monitor ? '运行中' : '未启动' }}</span>
          </div>
          <div class="row">
            <label>监控端口 <input type="number" v-model.number="ui.monitor_port" min="1024" max="65535" @change="saveUi" /></label>
          </div>
          <div class="url-box">
            <code>{{ monitorUrl }}</code>
            <button type="button" class="btn btn-sec" @click="copy(monitorUrl)">复制</button>
          </div>
          <div class="row">
            <button type="button" class="btn" @click="startMonitor">启动并打开</button>
            <button type="button" class="btn btn-sec" @click="stopMonitor">停止</button>
            <button type="button" class="btn btn-sec" @click="openMonitorUrl">仅打开</button>
          </div>
        </section>
        <section class="panel">
          <h2 class="panel-title">推理与游戏</h2>
          <p class="panel-lead">游戏页可以自己玩，也可以加载训练好的模型。从「记录」点演示会自动启动推理服务。</p>
          <div class="row">
            <span class="status-pill" :class="status.infer?'on':'off'">{{ status.infer ? '运行中' : '未启动' }}</span>
          </div>
          <div class="row">
            <label>推理端口 <input type="number" v-model.number="ui.inference_port" min="1024" max="65535" @change="saveUi" /></label>
          </div>
          <div class="url-box">
            <code>{{ playUrl }}</code>
            <button type="button" class="btn btn-sec" @click="copy(playUrl)">复制</button>
          </div>
          <div class="url-box">
            <code>{{ lanPlayUrl }}</code>
            <button type="button" class="btn btn-sec" @click="copy(lanPlayUrl)">复制局域网</button>
          </div>
          <div class="row">
            <button type="button" class="btn" @click="openGame">打开游戏页</button>
            <button type="button" class="btn btn-sec" @click="stopInfer">停止推理</button>
          </div>
        </section>
      </div>
      <section class="panel">
        <h2 class="panel-title">常见用法</h2>
        <div class="detail-grid">
          <span>只想玩游戏</span><span>直接打开游戏页，不需要启动推理。手机用上面的局域网地址。</span>
          <span>第一次训练</span><span>总览里点「5 分钟试跑」，确认流程后再换成标准训练或 scheme4。</span>
          <span>看 AI 演示</span><span>训练出权重后，到「记录」选中一次运行，点「用此模型演示」。</span>
          <span>中断后续训</span><span>有 training.pt 就用「原样继续练」；只想换学习率用「换参数继续练」。</span>
          <span>file:// 打开</span><span>web/index.html 可离线玩。模型演示需要先启动本控制台或 serve-model。</span>
        </div>
      </section>
    </template>

    <template v-if="tab==='doc'">
      <div class="row" style="margin-bottom:10px">
        <a class="btn btn-sec" href="/doc-static/custom-train-config.html" target="_blank" rel="noopener">在新标签打开手册</a>
      </div>
      <iframe class="doc" title="训练参数手册" src="/doc-static/custom-train-config.html"></iframe>
    </template>
  </div>

  <p class="kbd-hint">快捷键：<kbd>1</kbd>–<kbd>5</kbd> 切换分页 · 训练中底部可随时打开实况或停止</p>

  <div class="toasts" aria-live="polite">
    <div v-for="t in toasts" :key="t.id" class="toast" :class="t.kind">{{ t.msg }}</div>
  </div>

  <div v-if="confirmDlg" class="modal-backdrop" @click.self="confirmDlg.resolve(false)">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>{{ confirmDlg.title }}</h3>
      <p>{{ confirmDlg.text }}</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-sec" @click="confirmDlg.resolve(false)">取消</button>
        <button type="button" class="btn" :class="confirmDlg.danger ? 'btn-danger' : ''" @click="confirmDlg.resolve(true)">{{ confirmDlg.okLabel }}</button>
      </div>
    </div>
  </div>

  <div v-if="status.training" class="train-dock" role="status">
    <strong>训练中</strong>
    <span class="progress-meta">{{ progress.training_run || '' }} {{ progressLabel }}</span>
    <span class="dock-bar" aria-hidden="true"><i :style="{width: progress.percent + '%'}"></i></span>
    <span class="progress-meta">{{ etaLabel }}</span>
    <button type="button" class="btn btn-sec" @click="openTrainPreview">实况</button>
    <button type="button" class="btn btn-danger" @click="stopTrain">停止</button>
  </div>
</div>

<script src="/assets/console/api.js"></script>
<script src="/assets/console/config.js"></script>
<script src="/assets/console/ux.js"></script>
<script src="/assets/console/app.js"></script>
</body>
</html>
