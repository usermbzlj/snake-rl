<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>训练实况</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body class="preview-page">
    <div class="page-chrome preview-chrome">
      <span class="subtitle">训练实况</span>
      <a class="console-link" data-console-link href="/">返回控制台</a>
    </div>
    <div class="preview-header">
      <div class="preview-steps">
        <div class="step" id="step-engine"><span class="step-dot"></span>游戏引擎</div>
        <div class="step" id="step-train"><span class="step-dot"></span>训练接口</div>
        <div class="step" id="step-infer"><span class="step-dot"></span>推理服务</div>
        <div class="step" id="step-model"><span class="step-dot"></span>加载模型</div>
        <div class="step" id="step-play"><span class="step-dot"></span>演示中</div>
      </div>
      <div id="previewStatus">正在启动…</div>
      <div id="previewMetrics" class="preview-metrics" hidden></div>
      <div class="preview-actions" id="previewActions"></div>
    </div>

    <div class="app-shell preview-shell">
      <div class="layout">
        <main class="game-column">
          <div class="game-frame">
            <canvas id="gameCanvas" width="704" height="704" aria-label="训练预览画布"></canvas>
            <div class="board-hud" aria-label="游戏数据">
              <div class="hud-item"><span class="hud-label">分数</span><strong id="scoreValue">0</strong></div>
              <div class="hud-item"><span class="hud-label">最高</span><strong id="bestScoreValue">0</strong></div>
              <div class="hud-item"><span class="hud-label">长度</span><strong id="lengthValue">3</strong></div>
              <div class="hud-item"><span class="hud-label">等级</span><strong id="levelValue">1</strong></div>
              <div class="hud-item"><span class="hud-label">速度</span><strong id="speedValue">1x</strong></div>
            </div>
            <div id="overlay" class="overlay hidden">
              <h2 id="overlayTitle">预览</h2>
              <p id="overlayText">加载中</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- game.js 所需的隐藏占位 DOM -->
    <div class="visually-hidden" aria-hidden="true" inert>
      <button type="button" id="startBtn">开始</button>
      <button type="button" id="pauseBtn" disabled>暂停</button>
      <select id="difficulty"><option value="normal" selected>标准</option></select>
      <select id="mode"><option value="classic" selected>经典</option></select>
      <select id="boardSize"><option value="22" selected>22</option></select>
      <input id="inferenceServerUrl" type="text" value="http://127.0.0.1:8765" />
      <input id="checkpointPath" type="text" />
      <input id="aiStepDelay" type="number" value="40" />
      <input id="aiAutoLoop" type="checkbox" />
      <input id="showPerception" type="checkbox" checked />
      <button type="button" id="loadModelBtn">加载</button>
      <button type="button" id="startAiBtn">AI</button>
      <button type="button" id="stopAiBtn">停</button>
      <p id="aiStatus"></p>
      <section class="touch-controls">
        <button type="button" data-turn="left">L</button>
        <button type="button" data-turn="right">R</button>
      </section>
    </div>

    <script src="./game/constants.js"></script>
    <script src="./game/features.js"></script>
    <script src="./game/snake_game.js"></script>
    <script src="./game/remote_inference.js"></script>
    <script src="./game/chrome.js"></script>
    <script src="./train_preview.js"></script>
  </body>
</html>
